# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One always-on web service: builds the client with Vite, then runs the same
# server that already serves the LAN build, on Render's TLS-terminated
# https://…onrender.com hostname. No database, no second service — the game
# is intentionally in-memory only (see CLAUDE.md's Known limitations).
#
# Deploy: on render.com, New -> Blueprint, point it at this repo. Render
# reads this file and creates the service below with nothing further to
# configure. PORT is supplied by Render at runtime; server/index.ts already
# reads process.env.PORT, so nothing here needs to set it.
services:
  - type: web
    name: lost-cities
    runtime: node
    plan: free
    # npm ci, not npm install, for a reproducible build straight off the
    # lockfile. No NODE_ENV env var here on purpose: Render exports a
    # service's env vars during the build step too, not only at runtime, and
    # this npm version (10.x) skips devDependencies — typescript, vite,
    # @types/node, everything `npm run build`'s tsc/vite step needs — for
    # *both* `npm ci` and `npm install` whenever NODE_ENV=production is set,
    # with no way to opt back in short of removing the var. `npm start`
    # already sets NODE_ENV=production for the running server itself
    # (see the script below), so nothing here needs to set it too.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Express serves dist/client/index.html for every non-API path once
    # built, so the default "/" health check succeeds without extra config.
    healthCheckPath: /
