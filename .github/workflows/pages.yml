# Publishes the demo to GitHub Pages.
#
# Pages is served from the `gh-pages` branch rather than through
# actions/deploy-pages, because that action allows one deployment per
# environment and so cannot express a URL per pull request. Everything here
# is first-party actions plus git.
#
#   main       -> https://<owner>.github.io/<repo>/
#   PR #42     -> https://<owner>.github.io/<repo>/pr-42/
#   PR closed  -> that directory is removed again
#
# One-time setup, which a workflow cannot do for you:
#   Settings -> Pages -> Source -> "Deploy from a branch" -> gh-pages / (root)

name: Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  # Serialised across every trigger: each job commits to the same branch, and
  # two pushing at once is a lost update.
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out where this build is going
        id: target
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dir=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "base=/$repo/pr-${{ github.event.number }}/" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "base=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Build
        env:
          BASE_PATH: ${{ steps.target.outputs.base }}
        run: npm run build

      - name: Check out the published branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
          rm -rf .gh-pages
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add .gh-pages origin/gh-pages
          else
            git worktree add --detach .gh-pages
            git -C .gh-pages checkout --orphan gh-pages
            git -C .gh-pages rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Copy the build in
        run: |
          # --delete keeps the target honest, but pr-* must survive a push to
          # main: a preview is live for as long as its pull request is.
          #
          # --checksum is load-bearing, not a belt-and-braces flag. rsync's
          # default quick check skips a file when its size and mtime both
          # match, and index.html defeats both halves of that test: Vite's
          # content hashes are fixed-length, so the file is byte-for-byte the
          # same *size* on every build and only the hash characters differ.
          # That leaves mtime alone to decide — and the git worktree checkout
          # above and the build that precedes it land within the same second.
          # When they do, rsync copies the freshly hashed assets and skips
          # index.html, publishing a page whose every script and stylesheet
          # 404s. That is exactly what shipped to the root deployment: assets
          # replaced, index.html left pointing at a bundle the same commit
          # had just deleted.
          mkdir -p ".gh-pages/${{ steps.target.outputs.dir }}"
          rsync -a --checksum --delete --exclude 'pr-*' --exclude '.git' \
            dist/client/ ".gh-pages/${{ steps.target.outputs.dir }}/"
          # Tells Pages not to run the output through Jekyll, which would
          # drop any file or directory beginning with an underscore. After
          # the rsync, which would --delete it: it is not in dist/client.
          touch .gh-pages/.nojekyll

      - name: Refuse to publish a page whose assets are not there
        env:
          DIR: ${{ steps.target.outputs.dir }}
          BASE: ${{ steps.target.outputs.base }}
        run: |
          # A blank screen is the quietest possible failure: the build is
          # green, the commit lands, and the deployment is broken. Everything
          # index.html points at has to exist in the tree being published.
          cd ".gh-pages/$DIR"
          # Checked explicitly: with no index.html the loop below has nothing
          # to iterate and would pass an empty directory as healthy.
          if [ ! -f index.html ]; then
            echo "::error::no index.html in the tree being published"
            exit 1
          fi
          missing=0
          for ref in $(grep -oE '(src|href)="[^"]+"' index.html \
                       | sed 's/^[^"]*"//; s/"$//'); do
            case "$ref" in
              http*|//*|data:*|'#'*|mailto:*) continue ;;
            esac
            rel=${ref#"$BASE"}
            rel=${rel#/}
            if [ ! -f "$rel" ]; then
              echo "::error::index.html references '$ref' but '$rel' is not in the published tree"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to publish — this is what a blank page looks like."
            exit 1
          fi
          echo "index.html and the published assets agree."

      - name: Publish
        run: |
          cd .gh-pages
          git add -A
          if git diff --staged --quiet; then
            echo "No change to publish."
          else
            git commit -m "Deploy ${{ github.sha }} to ${{ steps.target.outputs.dir }}"
            git push origin HEAD:gh-pages
          fi

      - name: Leave the preview link on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo.repo;
            const url = `https://${context.repo.owner}.github.io/${repo}/pr-${context.issue.number}/#/demo`;
            const marker = '<!-- demo-preview -->';
            const body = [
              marker,
              `**Demo preview:** ${url}`,
              '',
              'Runs the real server in the browser — no backend. Open a phone',
              'route on an actual phone to test touch, haptics and safe areas.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove the preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || exit 0
          git worktree add .gh-pages origin/gh-pages
          cd .gh-pages
          rm -rf "pr-${{ github.event.number }}"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to clean up."
          else
            git commit -m "Remove preview for PR #${{ github.event.number }}"
            git push origin HEAD:gh-pages
          fi
